[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-change-lab"
version = "0.1.0"
description = "Offline synthetic research components for decision-change-lab"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
dcl = "decision_change_lab.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6", "Markdown==3.10.3"]

[tool.setuptools]
packages = ["decision_change_lab", "decision_change_lab.schemas"]
package-dir = {"decision_change_lab" = "src/decision_change_lab", "decision_change_lab.schemas" = "schemas"}

[tool.setuptools.package-data]
"decision_change_lab.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
